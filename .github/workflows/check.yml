name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build native mobile preview
        run: |
          if [ '${{ matrix.platform }}' = android ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          bash scripts/build-${{ matrix.platform }}.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-development-preview
          path: |
            bin/*.apk
            bin/*ios-simulator*.zip
          if-no-files-found: error
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/...
      - run: go vet ./internal/...
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun test app/ui/editor.test.js app/ui/calendar.test.js app/ui/agenda-query.test.js app/ui/local-graph.test.js app/ui/recurrence.test.js app/ui/workspace-settings.test.js app/editor/headings.test.js app/editor/metadata.test.js
      - run: bun install --frozen-lockfile && bun test search.test.js focus.test.js && bun run build
        working-directory: app/editor
      - run: git diff --exit-code -- app/ui/vendor
  native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: go build -o bin/ -tags production ./app
      - if: runner.os == 'Linux'
        # GitHub's nested sandbox restricts WebKit's bubblewrap namespaces.
        # This exception is only for the disposable CI probe, never the app.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GTK_A11Y: none
        run: dbus-run-session -- xvfb-run -a go run ./scripts/native-smoke ./examples/Welcome
